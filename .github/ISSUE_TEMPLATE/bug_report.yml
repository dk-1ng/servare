name: Bug report
description: Something does not work as expected
title: "fix: "
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a page with an HLS stream…
        2. Click download…
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options: [Firefox, Chrome, Edge, Brave, Other Chromium]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "Servare 0.1.0 · Firefox 140"
  - type: dropdown
    id: media
    attributes:
      label: Media type
      options: [Direct file, HLS, DASH, Live, Not sure]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Background/worker console. Remove cookies, tokens and private URLs.
      render: text
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The content is not from YouTube and is not DRM-protected.
          required: true
