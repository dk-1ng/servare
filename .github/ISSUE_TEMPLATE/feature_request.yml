name: Funcionalidade
description: Proponha uma melhoria ou nova funcionalidade
title: "feat: "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que necessidade isso resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: scope
    attributes:
      label: Escopo
      options:
        - label: A proposta não envolve YouTube, contorno de DRM ou de controles de acesso.
          required: true
