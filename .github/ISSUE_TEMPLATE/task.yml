name: Task
description: Planned unit of work (maintainers)
labels: ["status: ready"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this task exists and where it sits in the design.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
    validations:
      required: true
